<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Clientes - Sistema Distribuído</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>👥 Sistema de Cadastro de Clientes</h1>
            <p>Demonstração de CRUD completo - Sistemas Distribuídos</p>
        </header>

        <section class="form-section">
            <h2 id="form-title">Cadastrar Novo Cliente</h2>
            <form id="clienteForm">
                <input type="hidden" id="clienteId">
                <div class="form-group">
                    <label for="nome">Nome do Cliente:</label>
                    <input type="text" id="nome" name="nome" maxlength="120" required>
                </div>
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" maxlength="160" required>
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone:</label>
                    <input type="text" id="telefone" name="telefone" inputmode="numeric" placeholder="(11) 91234-5678">
                </div>
                <div class="form-group">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" inputmode="numeric" placeholder="000.000.000-00" required>
                </div>
                <div class="form-buttons">
                    <button type="submit" id="btnSalvar">Cadastrar Cliente</button>
                    <button type="button" id="btnCancelar" style="display: none;">Cancelar Edição</button>
                </div>
            </form>
        </section>

        <section class="list-section">
            <h2>📋 Clientes Cadastrados</h2>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Buscar cliente...">
                <button onclick="buscarClientes()">🔍 Buscar</button>
            </div>
            <div id="loading" class="loading" style="display: none;">
                Carregando clientes...
            </div>
            <div id="clientesList" class="clientes-list"></div>
        </section>

        <div id="confirmModal" class="modal">
            <div class="modal-content">
                <h3>Confirmação</h3>
                <p id="confirmMessage">Tem certeza que deseja excluir este cliente?</p>
                <div class="modal-buttons">
                    <button id="confirmYes" class="btn-danger">Sim</button>
                    <button id="confirmNo">Cancelar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
